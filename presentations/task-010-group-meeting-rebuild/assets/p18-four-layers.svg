<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560"><defs><marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#167a73"/></marker><marker id="back" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#c8763d"/></marker></defs><rect width="1400" height="560" fill="#ffffff"/><rect x="30" y="94" width="319" height="340" rx="4" fill="#e9f0f8" stroke="#ceddd8" stroke-width="2"/><text x="189" y="158" fill="#19383b" text-anchor="middle" font-size="25" font-weight="bold" font-family="Microsoft YaHei,Arial,sans-serif">1 仿真结果</text><text x="189" y="244" fill="#19383b" text-anchor="middle" font-size="19" font-weight="normal" font-family="Microsoft YaHei,Arial,sans-serif">性能与求解条件</text><line x1="72" y1="284" x2="307" y2="284" stroke="#167a73" stroke-width="2"/><text x="189" y="337" fill="#58656a" text-anchor="middle" font-size="18" font-weight="normal" font-family="Microsoft YaHei,Arial,sans-serif">数值反馈</text><text x="189" y="367" fill="#58656a" text-anchor="middle" font-size="18" font-weight="normal" font-family="Microsoft YaHei,Arial,sans-serif">不自动等于物理正确</text><line x1="354" y1="262" x2="371" y2="262" stroke="#167a73" stroke-width="4" marker-end="url(#arr)"/><rect x="377" y="94" width="319" height="340" rx="4" fill="#f8ede3" stroke="#c8763d" stroke-width="4"/><text x="536" y="158" fill="#19383b" text-anchor="middle" font-size="25" font-weight="bold" font-family="Microsoft YaHei,Arial,sans-serif">2 物理诊断</text><text x="536" y="244" fill="#19383b" text-anchor="middle" font-size="19" font-weight="normal" font-family="Microsoft YaHei,Arial,sans-serif">识别原因与关键变量</text><line x1="419" y1="284" x2="654" y2="284" stroke="#167a73" stroke-width="2"/><text x="536" y="337" fill="#58656a" text-anchor="middle" font-size="18" font-weight="normal" font-family="Microsoft YaHei,Arial,sans-serif">提出可被再仿真检验的假设</text><line x1="701" y1="262" x2="718" y2="262" stroke="#167a73" stroke-width="4" marker-end="url(#arr)"/><rect x="724" y="94" width="319" height="340" rx="4" fill="#f8ede3" stroke="#c8763d" stroke-width="4"/><text x="883" y="158" fill="#19383b" text-anchor="middle" font-size="25" font-weight="bold" font-family="Microsoft YaHei,Arial,sans-serif">3 设计决策</text><text x="883" y="244" fill="#19383b" text-anchor="middle" font-size="19" font-weight="normal" font-family="Microsoft YaHei,Arial,sans-serif">选修改策略与动作</text><line x1="766" y1="284" x2="1001" y2="284" stroke="#167a73" stroke-width="2"/><text x="883" y="337" fill="#58656a" text-anchor="middle" font-size="18" font-weight="normal" font-family="Microsoft YaHei,Arial,sans-serif">比较候选动作及其预期作用</text><line x1="1048" y1="262" x2="1065" y2="262" stroke="#167a73" stroke-width="4" marker-end="url(#arr)"/><rect x="1071" y="94" width="319" height="340" rx="4" fill="#e9f0f8" stroke="#ceddd8" stroke-width="2"/><text x="1230" y="158" fill="#19383b" text-anchor="middle" font-size="25" font-weight="bold" font-family="Microsoft YaHei,Arial,sans-serif">4 下一轮仿真</text><text x="1230" y="244" fill="#19383b" text-anchor="middle" font-size="19" font-weight="normal" font-family="Microsoft YaHei,Arial,sans-serif">工具执行与验证</text><line x1="1113" y1="284" x2="1348" y2="284" stroke="#167a73" stroke-width="2"/><text x="1230" y="337" fill="#58656a" text-anchor="middle" font-size="18" font-weight="normal" font-family="Microsoft YaHei,Arial,sans-serif">验证预测</text><text x="1230" y="367" fill="#58656a" text-anchor="middle" font-size="18" font-weight="normal" font-family="Microsoft YaHei,Arial,sans-serif">记录失败与更新</text><text x="700" y="475" fill="#167a73" text-anchor="middle" font-size="21" font-weight="normal" font-family="Microsoft YaHei,Arial,sans-serif">强反例：AutoPhotonicDesign 已有求解器反馈与迭代，不能预设诊断缺口</text><text x="700" y="522" fill="#58656a" text-anchor="middle" font-size="21" font-weight="normal" font-family="Microsoft YaHei,Arial,sans-serif">候选方向：新增能力、相对优化的价值与可靠性增益均待验证</text></svg>