<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560"><defs><marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#167a73"/></marker><marker id="back" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#c8763d"/></marker></defs><rect width="1400" height="560" fill="#ffffff"/><rect x="65" y="28" width="1270" height="93" rx="4" fill="#e9f0f8" stroke="#d5e1dd" stroke-width="2"/><text x="700.0" y="63.34" fill="#19383b" text-anchor="middle" font-size="25" font-weight="bold" font-family="Microsoft YaHei,Arial,sans-serif">总体目标：面向真实 PIC 设计任务的智能设计方法</text><text x="700.0" y="88.45" fill="#58656a" text-anchor="middle" font-size="19" font-weight="normal" font-family="Microsoft YaHei,Arial,sans-serif">AI 在物理要求与专业工具支持下参与器件/电路设计</text><line x1="700" y1="124" x2="700" y2="151" stroke="#167a73" stroke-width="4" marker-end="url(#arr)"/><rect x="208" y="159" width="984" height="91" rx="4" fill="#d6eee7" stroke="#d5e1dd" stroke-width="2"/><text x="700.0" y="193.57999999999998" fill="#19383b" text-anchor="middle" font-size="25" font-weight="bold" font-family="Microsoft YaHei,Arial,sans-serif">当前优先切入：需求理解 + 物理约束处理</text><text x="700.0" y="218.15" fill="#58656a" text-anchor="middle" font-size="19" font-weight="normal" font-family="Microsoft YaHei,Arial,sans-serif">结构化要求 · 识别关键条件 · 一致性检查 · 正确传递</text><line x1="700" y1="252" x2="700" y2="278" stroke="#167a73" stroke-width="4" marker-end="url(#arr)"/><rect x="135" y="285" width="1130" height="82" rx="4" fill="#f8ede3" stroke="#d5e1dd" stroke-width="2"/><text x="700.0" y="316.16" fill="#19383b" text-anchor="middle" font-size="22" font-weight="bold" font-family="Microsoft YaHei,Arial,sans-serif">后续可能扩展：工具执行 → 仿真验证 → 反馈优化 → 跨任务复用</text><text x="700.0" y="338.3" fill="#58656a" text-anchor="middle" font-size="18" font-weight="normal" font-family="Microsoft YaHei,Arial,sans-serif">以 1×2 MMI 等真实任务考察价值；具体方案尚未确定</text><text x="700" y="410" fill="#167a73" text-anchor="middle" font-size="23" font-weight="bold" font-family="Microsoft YaHei,Arial,sans-serif">尚未确定的三个问题</text><rect x="25" y="434" width="435" height="83" rx="4" fill="#f7f9f8" stroke="#d8e5e0" stroke-width="2"/><text x="242" y="485" fill="#19383b" text-anchor="middle" font-size="18" font-weight="normal" font-family="Microsoft YaHei,Arial,sans-serif">Q1  已有方法的约束能力到何程度？</text><rect x="486" y="434" width="435" height="83" rx="4" fill="#f7f9f8" stroke="#d8e5e0" stroke-width="2"/><text x="703" y="485" fill="#19383b" text-anchor="middle" font-size="18" font-weight="normal" font-family="Microsoft YaHei,Arial,sans-serif">Q2  重点研究表达、冲突、传递还是保持？</text><rect x="947" y="434" width="435" height="83" rx="4" fill="#f7f9f8" stroke="#d8e5e0" stroke-width="2"/><text x="1164" y="485" fill="#19383b" text-anchor="middle" font-size="18" font-weight="normal" font-family="Microsoft YaHei,Arial,sans-serif">Q3  用哪个真实物理任务验证价值与通用性？</text></svg>