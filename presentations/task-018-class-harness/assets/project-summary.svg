<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="540" viewBox="0 0 1400 540"><rect width="1400" height="540" fill="white"/><rect x="30" y="30" width="1340" height="88" rx="4" fill="#eaf0f7"/><text x="190" y="83" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="30" fill="#18364a" font-weight="700">PhIDO</text><text x="860" y="83" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="29" fill="#18364a" font-weight="400">自然语言 → 结构化设计与版图</text><rect x="30" y="135" width="1340" height="88" rx="4" fill="#e6f3ef"/><text x="190" y="188" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="30" fill="#18364a" font-weight="700">PICopilot</text><text x="860" y="188" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="29" fill="#18364a" font-weight="400">自然语言 → PIC 脚本与功能评价</text><rect x="30" y="240" width="1340" height="88" rx="4" fill="#fbefe3"/><text x="190" y="293" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="30" fill="#18364a" font-weight="700">Kharel</text><text x="860" y="293" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="29" fill="#18364a" font-weight="400">显式规则 → 仿真反馈 → 定量迭代</text><text x="700" y="394" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="29" fill="#167b78" font-weight="700">已有项目构成方法基础，成功定义与验证层级需要区分</text><text x="700" y="455" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="30" fill="#18364a" font-weight="700">我的切入点：让仿真后的诊断与动作选择得到证据检验</text><text x="700" y="505" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="25" fill="#536570" font-weight="400">方法增益待验证；DAS 可作为后续复杂应用场景</text></svg>