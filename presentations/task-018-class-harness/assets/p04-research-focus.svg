<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520"><defs><marker id="arr" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8Z" fill="#167b78"/></marker></defs><rect width="1400" height="520" fill="white"/><text x="700" y="50" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="30" fill="#167b78" font-weight="700">候选研究问题：如何利用物理知识与真实反馈选择下一步？</text><rect x="40" y="145" width="420" height="180" rx="5" fill="#eaf0f7" stroke="#c9d8df" stroke-width="2"/><text x="250.0" y="185" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="28" fill="#18364a" font-weight="700">仿真结果</text><text x="250.0" y="223" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="23" fill="#536570" font-weight="400">功率 / 光谱 / 场分布</text><text x="250.0" y="254" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="23" fill="#536570" font-weight="400">模型与求解条件</text><rect x="490" y="145" width="420" height="180" rx="5" fill="#fbefe3" stroke="#c9d8df" stroke-width="2"/><text x="700.0" y="185" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="28" fill="#18364a" font-weight="700">物理诊断</text><text x="700.0" y="223" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="23" fill="#536570" font-weight="400">哪里偏离目标？</text><text x="700.0" y="254" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="23" fill="#536570" font-weight="400">提出原因假设</text><rect x="940" y="145" width="420" height="180" rx="5" fill="#e6f3ef" stroke="#c9d8df" stroke-width="2"/><text x="1150.0" y="185" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="28" fill="#18364a" font-weight="700">设计决策</text><text x="1150.0" y="223" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="23" fill="#536570" font-weight="400">改参数 / 换策略</text><text x="1150.0" y="254" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="23" fill="#536570" font-weight="400">或补充验证</text><path d="M465,235 L485,235" fill="none" stroke="#167b78" stroke-width="3" marker-end="url(#arr)"/><path d="M915,235 L935,235" fill="none" stroke="#167b78" stroke-width="3" marker-end="url(#arr)"/><rect x="490" y="375" width="870" height="90" rx="5" fill="#e6f3ef" stroke="#c9d8df" stroke-width="2"/><text x="925" y="412" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="27" fill="#167b78" font-weight="700">把诊断写成可检验预测</text><text x="925" y="447" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="25" fill="#536570" font-weight="400">下一轮仿真是否支持预测？</text><path d="M1150,333 L1150,368" fill="none" stroke="#167b78" stroke-width="3" marker-end="url(#arr)"/><path d="M485,420 L245,420 L245,333" fill="none" stroke="#167b78" stroke-width="3" marker-end="url(#arr)"/><text x="245" y="467" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="22" fill="#536570" font-weight="400">新证据可修正原假设</text></svg>