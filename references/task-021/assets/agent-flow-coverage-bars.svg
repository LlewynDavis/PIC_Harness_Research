<desc id="desc">上方为九个环节的主干流程，下方为四项目覆盖条。深青为直接展示，浅青为部分覆盖，灰为未核实。</desc>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}.stage{font-size:21px;font-weight:600;fill:#fff}.project{font-size:23px;font-weight:600;fill:#183E48}</style>
