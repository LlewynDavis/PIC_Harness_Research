site_name: PIC 执行框架研究门户（PIC Harness Research Portal）
site_description: TASK-004 至 TASK-006 调研成果的本地人工阅读层

docs_dir: portal/docs
site_dir: portal/site
use_directory_urls: false

theme:
  name: material
  language: zh
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换至深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-4
        name: 切换至浅色模式
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path:
        - .
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_div_format

plugins:
  - search

extra_css:
  - assets/extra.css

extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js
  - assets/mermaid-init.js

nav:
  - TASK-006 路线收敛:
      - 首页: index.md
      - 审查包: task-006-overview.md
      - 三方向技术地图: task-006-technical-map.md
      - DAS × 智能体设计: task-006-das-agentic.md
      - 光子人工智能计算项目: task-006-photonic-ai-projects.md
      - 智能体 PIC 项目: task-006-agentic-projects.md
      - 跨方向与内部比较: task-006-comparison.md
      - Paper2Agent 候选技术: task-006-paper2agent.md
      - 候选研究路线: task-006-routes.md
      - 条件与对抗性审查: task-006-critical-review.md
      - 证据与检索: task-006-evidence.md
  - TASK-005 已验收档案:
      - 审查材料总览: review-package.md
      - 技术层级地图: technical-map-and-objects.md
      - 能力矩阵: capability-and-verification-matrix.md
      - 参考架构: reference-architecture-v0.md
      - 研究缺口: research-gaps-and-route-seeds.md
      - 候选路线: candidate-routes.md
      - 证据与来源: source-log.md
